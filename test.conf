# =========================
# Server 1: Default site
# =========================
server {
	listen 7080;
	server_name localhost;

# root /var/www/example;
	index index.html;

	autoindex off;
	client_max_body_size 5M;

	error_page {
		403 /errors/403.html;
		404 /errors/404.html;
		500 /errors/500.html;
		502 /errors/502.html;
		504 /errors/504.html;
		505 /errors/505.html;
		578 /ascii/body.html;
	}

	location / {
		allow_methods GET POST PUT;
	}

	location /redirect {
		return 302 /;
	}

	location /youtube {
		return 302 https://youtube.com;
	}

	location /body {
		return 578;
	}
}

# =========================
# Server 2: CGI
# =========================
server {
    listen 7081;
    server_name localhost;

	# root /home/aakerblo/to_home/common_core/webserv/files/;
	index index.html;

	autoindex off;

    cgi {
        path /cgi-bin;
        python /usr/bin/python3;
        php /usr/bin/php;
    }

    location /cgi-bin {
        allow_methods GET POST;
		autoindex on;
		index cgi.html;
    }
}
