worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # =========================
    # Server 1: Default site
    # =========================
    server {
        listen 4443;
        server_name example.com www.example.com localhost;

        root /home/tcardair/Desktop/webserv/files;
        index index.html;

        autoindex off;
        client_max_body_size 5M;

        # map individual error codes to files under /errors/
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 500 /errors/500.html;
        error_page 502 /errors/502.html;
        error_page 504 /errors/504.html;
        error_page 505 /errors/505.html;
        error_page 578 /errors/clown.html;

        location / {
            # allow only GET requests; deny others
            limit_except GET {
                deny all;
            }

            # local override for 404 within this location (optional)
            error_page 404 /errors/clown.html;
        }

        location /redirect {
            # redirect to the site root (adjust target as you prefer)
            return 302 https://example.com$request_uri;
        }

        location /youtube {
            # redirect to YouTube
            return 302 https://www.youtube.com$request_uri;
        }

        location /clown {
            # trigger custom error code which will be served by error_page above
            return 578;
        }
    }

    # =========================
    # Server 2: API server
    # =========================
    server {
        listen 8080;
        server_name api.example.com;

        root /var/www/api;
        index index.json;

        autoindex off;
        client_max_body_size 20M;

        error_page 400 404 /errors/api_error.json;

        location / {
            limit_except GET POST DELETE {
                deny all;
            }
        }

        location /upload {
            limit_except POST {
                deny all;
            }
            client_max_body_size 100M;
        }
    }

    # =========================
    # Server 3: Static files
    # =========================
    server {
        listen 8081;
        server_name static.example.com;

        root /var/www/static;
        index index.html index.htm;

        autoindex on;

        location / {
            limit_except GET {
                deny all;
            }
        }

        location /images/ {
            autoindex on;
            limit_except GET {
                deny all;
            }
        }

        location /uploads {
            autoindex on;
            limit_except GET POST DELETE {
                deny all;
            }
        }
    }

    # =========================
    # Server 4: Catch-all
    # =========================
    server {
        listen 8081;
        server_name _;

        # catch-all for unknown hostnames on port 8081
        return 302 https://www.youtube.com$request_uri;
    }

    # include additional confs if present
    include /etc/nginx/conf.d/*.conf;
}