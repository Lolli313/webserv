<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Test - Aero Webserver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .back-link:hover { text-decoration: underline; }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin: 30px 0;
            background: #f8f9ff;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }
        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            width: 100%;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-delete {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            margin-left: 10px;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        #status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        #status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        #preview {
            margin-top: 30px;
            padding: 20px;
            border-top: 2px solid #e0e0e0;
            display: none;
        }
        #preview img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 15px;
        }
        #preview a {
            color: #667eea;
            font-weight: bold;
            font-size: 1.1em;
        }
        .info-box {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
        }
        .info-box h3 {
            color: #856404;
            margin-bottom: 10px;
        }
        .info-box ul {
            margin-left: 20px;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Test Suite</a>
        
        <h1>📤 File Upload Test</h1>
        <p>Test the webserver's ability to handle multipart/form-data file uploads.</p>

        <div class="info-box">
            <h3>What this tests:</h3>
            <ul>
                <li>POST method with multipart/form-data</li>
                <li>Boundary parsing</li>
                <li>File content extraction</li>
                <li>Writing to upload directory </li>
            </ul>
        </div>

        <div class="upload-area">
            <h2>Select a file to upload</h2>
            <input type="file" id="fileInput">
            <br>
            <button class="btn" onclick="handleUpload()">Upload to Server</button>
        </div>

        <div id="status"></div>

        <div id="preview">
            <h3>Uploaded File:</h3>
            <div id="content"></div>
            <button class="btn btn-delete" onclick="handleDelete()">Delete File</button>
        </div>
    </div>

    <script>
        let uploadedFileName = "";
        const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB limit

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function sanitizeFilename(filename) {
            // Replace spaces with underscores
            // Remove or replace other problematic characters
            return filename
                .replace(/\s+/g, '_')           // spaces to underscores
                .replace(/[()]/g, '')           // remove parentheses
                .replace(/[^\w.-]/g, '_');      // replace other special chars with underscore
        }

        async function handleUpload() {
            const input = document.getElementById('fileInput');
            const status = document.getElementById('status');
            
            if (!input.files[0]) {
                status.className = 'error';
                status.style.display = 'block';
                status.innerText = "⚠️ Please select a file first!";
                return;
            }

            const file = input.files[0];
            const originalName = file.name;
            const sanitizedName = sanitizeFilename(originalName);
            uploadedFileName = sanitizedName;

            console.log('Original filename:', originalName);
            console.log('Sanitized filename:', sanitizedName);
            console.log('File size:', file.size, 'bytes | Max allowed:', MAX_FILE_SIZE, 'bytes');
            console.log('File size check:', file.size > MAX_FILE_SIZE ? 'BLOCKED' : 'ALLOWED');

            // Check file size - block if over 10MB
            if (file.size > MAX_FILE_SIZE) {
                status.className = 'error';
                status.style.display = 'block';
                status.innerText = `❌ File too large! ${formatFileSize(file.size)} exceeds 10MB limit.`;
                console.log('Upload BLOCKED - file too large');
                return;
            }
            
            console.log('Proceeding with upload...');

            // Show uploading status
            status.className = '';
            status.style.display = 'block';
            status.innerText = "⏳ Uploading...";

            // Create FormData for multipart/form-data upload
            // Rename the file by creating a new File object with sanitized name
            const renamedFile = new File([file], sanitizedName, { type: file.type });
            const formData = new FormData();
            formData.append('file', renamedFile);

            try {
                const response = await fetch('/uploads', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    status.className = 'success';
                    status.innerText = `✅ Upload successful! File saved `;
                    showPreview(file);
                } else {
                    status.className = 'error';
                    status.innerText = `❌ Upload failed with status: ${response.status}`;
                }
            } catch (e) {
                status.className = 'error';
                status.innerText = "❌ Error: Server unreachable - " + e.message;
            }
        }

        function showPreview(file) {
            const preview = document.getElementById('preview');
            const content = document.getElementById('content');
            preview.style.display = 'block';
            content.innerHTML = "";

            // Check by extension for more reliable detection
            const ext = file.name.toLowerCase().split('.').pop();
            const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg'];

            if (imageExts.includes(ext)) {
                const img = document.createElement('img');
                // Add timestamp to bust cache
                img.src = '/uploads/' + encodeURIComponent(uploadedFileName) + '?t=' + Date.now();
                img.alt = uploadedFileName;
                img.onerror = function() {
                    content.innerHTML = `<p style="color: red;">❌ Failed to load image.</p>
                    <a href="/uploads/${encodeURIComponent(uploadedFileName)}" target="_blank">Try opening directly</a>`;
                };
                img.onload = function() {
                    console.log('Image loaded successfully:', uploadedFileName);
                };
                content.appendChild(img);
            } else {
                const link = document.createElement('a');
                link.href = '/uploads/' + encodeURIComponent(uploadedFileName);
                link.target = '_blank';
                link.innerText = "📄 View: " + file.name;
                content.appendChild(link);
            }
        }

        async function handleDelete() {
            if (!confirm("Delete " + uploadedFileName + "?")) return;

            const status = document.getElementById('status');
            status.className = '';
            status.style.display = 'block';
            status.innerText = "⏳ Deleting...";

            try {
                // Add timeout to prevent hanging
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 second timeout

                const response = await fetch('/uploads/' + encodeURIComponent(uploadedFileName), {
                    method: 'DELETE',
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (response.ok) {
                    status.className = 'success';
                    status.innerText = "✅ File deleted successfully!";
                    document.getElementById('preview').style.display = 'none';
                    document.getElementById('fileInput').value = '';
                    uploadedFileName = "";
                } else {
                    const text = await response.text();
                    status.className = 'error';
                    status.innerText = `❌ Delete failed with status: ${response.status}\n${text}`;
                }
            } catch (e) {
                status.className = 'error';
                if (e.name === 'AbortError') {
                    status.innerText = "❌ Delete request timed out (5s). Server may not be responding.";
                } else {
                    status.innerText = `❌ Delete error: ${e.message}`;
                }
            }
        }
    </script>
</body>
</html>
